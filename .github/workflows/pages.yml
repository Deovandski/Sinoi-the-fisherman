name: Website and web build

# Exports the Godot project for the web as an installable app (PWA) into
# site/play/, finishes it with tools/web_postexport.py, and deploys site/ to
# GitHub Pages. Every export gets a new service-worker cache version, so
# installed players are offered the update in-game.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["game/**", "site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["game/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot and web templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-web-v1

      - name: Download Godot and web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d /tmp/t
          mv /tmp/t/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f /tmp/godot.zip /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      - name: Run tests
        run: |
          ~/godot/godot --headless --path game -s res://tests/test_save_manager.gd
          ~/godot/godot --headless --path game -s res://tests/test_fight_modes.gd
          ~/godot/godot --headless --path game -s res://tests/test_fish_fights.gd

      - name: Shared site pieces match their one source
        run: python3 tools/sync_site.py --check

      - name: Export web build (installable PWA at /play/)
        run: |
          mkdir -p site/play
          ~/godot/godot --headless --path game --export-release "Web" ../site/play/index.html
          python3 tools/web_postexport.py site/play
          for f in index.html index.wasm index.pck index.manifest.json index.service.worker.js \
                   index.offline.html index.144x144.png index.180x180.png index.512x512.png; do
            test -f "site/play/$f" || { echo "::error::missing site/play/$f"; exit 1; }
          done
          test -f site/manifest.webmanifest || { echo "::error::missing site/manifest.webmanifest"; exit 1; }
          grep -q "Sinoi: network first" site/play/index.service.worker.js || { echo "::error::service worker isn't network first"; exit 1; }
          grep -q 'src="index.js?v=' site/play/index.html || { echo "::error::index.js isn't versioned"; exit 1; }

      - name: Fake-deploy check (new page and script on the first visit, offline still works)
        run: |
          pip install --quiet playwright
          python3 tools/check_fresh_deploy.py site --chrome "$(command -v google-chrome || command -v chromium)"

      - name: Build llms-full.txt (text of every page, for AI readers)
        run: |
          python3 tools/build_llms_full.py site
          for f in llms.txt llms-full.txt sitemap.xml google0c08003a2b869d98.html; do
            test -s "site/$f" || { echo "::error::missing site/$f"; exit 1; }
          done
          grep -o "CACHE_VERSION = '[^']*'" site/play/index.service.worker.js
          ls -la site/play

      - name: Report deployed size
        run: |
          {
            echo "### Deployed site size"
            echo "| What | Size |"
            echo "| --- | --- |"
            echo "| Whole site (\`site/\`) | $(du -sh site | cut -f1) |"
            echo "| Game engine (\`index.wasm\`) | $(du -h site/play/index.wasm | cut -f1) |"
            echo "| Game data (\`index.pck\`) | $(du -h site/play/index.pck | cut -f1) |"
            echo "| Pages without the game | $(du -sh --exclude=play site | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh site site/play

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
