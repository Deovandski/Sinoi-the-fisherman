name: Website and web build

# Exports the Godot project for the web as an installable app (PWA) into
# site/play/, finishes it with tools/web_postexport.py, and deploys site/ to
# GitHub Pages. Every export gets a new service-worker cache version, so
# installed players are offered the update in-game.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["game/**", "site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["game/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-web-v1

      - name: Download Godot and web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d /tmp/t
          mv /tmp/t/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f /tmp/godot.zip /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      - name: Run tests
        run: ~/godot/godot --headless --path game -s res://tests/test_save_manager.gd

      - name: Export web build (installable PWA at /play/)
        run: |
          mkdir -p site/play
          ~/godot/godot --headless --path game --export-release "Web" ../site/play/index.html
          python3 tools/web_postexport.py site/play
          for f in index.html index.wasm index.pck index.manifest.json index.service.worker.js \
                   index.offline.html index.144x144.png index.180x180.png index.512x512.png; do
            test -f "site/play/$f" || { echo "::error::missing site/play/$f"; exit 1; }
          done
          grep -o "CACHE_VERSION = '[^']*'" site/play/index.service.worker.js
          ls -la site/play

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
